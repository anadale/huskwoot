openapi: 3.1.0
info:
  title: Huskwoot Backend API
  version: 0.2.0
  description: |
    REST+SSE API for Huskwoot mobile and desktop clients. The contract version
    is reflected in info.version and returned in GET /v1/me.
    Authentication uses device bearer tokens issued by the CLI via `huskwoot devices create`
    (in later phases — via Telegram pairing).
servers:
  - url: https://huskwoot.example/
    description: Example production instance; the actual address is set in config.toml.
  - url: http://127.0.0.1:8080/
    description: Local development.
tags:
  - name: me
    description: Current device identification and instance metadata.
  - name: projects
    description: Project CRUD.
  - name: tasks
    description: Task CRUD, including complete/reopen/move and lookup by ref.
  - name: devices
    description: Owner device management.
  - name: pairing
    description: Pairing flow — connecting a new client device via Telegram magic-link.
  - name: chat
    description: Synchronous chat with the agent and client chat history.
  - name: events
    description: Real-time domain event stream via SSE.
  - name: sync
    description: Cold re-sync snapshot for clients that have fallen behind the retention window.
  - name: datetime
    description: Server date/time configuration for client preset resolution.
  - name: meta
    description: Service resources (OpenAPI specification).
security:
  - bearerAuth: []
paths:
  /v1/openapi.yaml:
    get:
      tags: [meta]
      summary: Get OpenAPI specification
      description: Returns the embedded YAML specification document. Available without a bearer token.
      security: []
      responses:
        "200":
          description: YAML specification.
          content:
            application/yaml:
              schema:
                type: string
  /v1/datetime/config:
    get:
      tags: [datetime]
      summary: Get date/time configuration
      description: Returns the server-side date/time configuration for client preset resolution.
      responses:
        "200":
          description: Date/time configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DateTimeConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me:
    get:
      tags: [me]
      summary: Current device and instance identification
      responses:
        "200":
          description: Snapshot of the owner, current device, and API version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/projects:
    get:
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Array of projects.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [projects]
      summary: Create a project
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: |
            Input parsing error. Alias-specific codes: `alias_invalid` (alias format is invalid).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Forbidden. Alias-specific codes: `alias_forbidden_for_inbox` (aliases are not allowed for the Inbox project).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Uniqueness conflict. Alias-specific codes: `alias_taken` (alias already used by another project),
            `alias_conflicts_with_name` (alias matches another project name or slug),
            `alias_limit_reached` (project already has 10 aliases).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [projects]
      summary: Get project by ID
      responses:
        "200":
          description: Project snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [projects]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: |
            Input parsing error. Alias-specific codes: `alias_invalid` (alias format is invalid).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Forbidden. Alias-specific codes: `alias_forbidden_for_inbox` (aliases are not allowed for the Inbox project).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Uniqueness conflict. Alias-specific codes: `alias_taken` (alias already used by another project),
            `alias_conflicts_with_name` (alias matches another project name or slug),
            `alias_limit_reached` (project already has 10 aliases).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tasks:
    get:
      tags: [tasks]
      summary: List tasks
      parameters:
        - in: query
          name: project_id
          schema:
            type: string
          description: Filter by project UUID.
        - in: query
          name: status
          schema:
            type: string
            enum: [open, done, cancelled]
          description: Filter by status.
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          description: Return tasks updated no earlier than this time (RFC3339).
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque pagination cursor from the next_cursor of the previous response.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Maximum records per page. Default 50.
      responses:
        "200":
          description: Page of tasks and an optional next_cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasksPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [tasks]
      summary: Create a task
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/tasks/by-ref/{ref}:
    parameters:
      - in: path
        name: ref
        required: true
        schema:
          type: string
        description: Human-readable ref of the form <slug>-<number>, e.g. "inbox-42".
    get:
      tags: [tasks]
      summary: Find a task by human-readable ref
      responses:
        "200":
          description: Task found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      tags: [tasks]
      summary: Get task by ID
      responses:
        "200":
          description: Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [tasks]
      summary: Update task fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [tasks]
      summary: Soft-delete a task (status = "cancelled")
      responses:
        "200":
          description: Updated task with status cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tasks/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    post:
      tags: [tasks]
      summary: Mark a task as completed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Task with status=done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tasks/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    post:
      tags: [tasks]
      summary: Reopen a task (status = open)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Task with status=open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tasks/{id}/move:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    post:
      tags: [tasks]
      summary: Move a task to another project
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveTaskRequest"
      responses:
        "200":
          description: Task with a new project_id and number recalculated for the target project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/devices:
    get:
      tags: [devices]
      summary: List owner devices
      responses:
        "200":
          description: All devices, including revoked ones (with revoked_at set).
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices/me:
    patch:
      tags: [devices]
      summary: Update push tokens for the current device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceMeRequest"
      responses:
        "200":
          description: Updated device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    delete:
      tags: [devices]
      summary: Revoke a device
      responses:
        "204":
          description: Device revoked; subsequent requests with this bearer token will return 401.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/chat:
    post:
      tags: [chat]
      summary: Synchronous request to the agent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Agent reply and list of affected entities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          description: Client disconnected before the agent responded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "504":
          description: Agent did not respond within the configured chat_timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/chat/history:
    get:
      tags: [chat]
      summary: Chat history for the current device
      description: |
        Returns one page of the agent chat of the current device (text and voice
        messages, agent replies and voice failures), isolated from Telegram DMs.
        A page holds the newest `limit` entries older than `before`, ordered
        oldest to newest. To load older entries, pass the returned `nextBefore`
        as `before`; `nextBefore` is omitted on the last page.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Maximum records per page. Default 50; larger values are capped at 500.
        - in: query
          name: before
          schema:
            type: string
          description: |
            Message id cursor (exclusive): the page holds entries older than this
            message. Omit it to start from the newest entry. Must be the `id` of
            an entry in this device's chat history.
      responses:
        "200":
          description: History page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
        "400":
          description: |
            `limit` is not a positive integer, or `before` is not the id of a
            message in this device's chat history (code `bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/chat/voice:
    post:
      tags: [chat]
      summary: Submit a voice message to the agent (async)
      description: |
        Accepts a multipart upload containing audio and metadata. The server
        saves the file to disk, enqueues a transcription job, and returns 202
        immediately. The transcription result and agent reply are delivered via
        the /v1/events SSE stream as two consecutive `chat_message_created`
        events (role=user for the transcript, role=agent for the reply).
        On transcription failure a `voice_failed` event is emitted instead, and
        the failure is kept in GET /v1/chat/history as an entry with role
        `system` and kind `error`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, metadata]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Raw audio bytes. Content-Type must match metadata.mimeType.
                metadata:
                  $ref: "#/components/schemas/VoiceChatMetadata"
      responses:
        "202":
          description: Voice job accepted; result will arrive via /v1/events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceJobCreatedResponse"
        "400":
          description: |
            Input validation error. Codes: `invalid_audio` (missing audio part),
            `invalid_metadata` (missing or malformed metadata JSON, or mimeType mismatch),
            `duration_too_long` (durationMs exceeds server max_duration),
            `project_not_found` (projectId UUID does not exist).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Audio file exceeds the server-configured voice_max_bytes limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: mimeType is not in the accepted list (audio/ogg;codecs=opus, audio/mp4, audio/webm;codecs=opus, audio/wav).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Per-device rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error (e.g. failure to write upload file or enqueue the job).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Transcription provider is not configured (transcriber.provider is empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/events:
    get:
      tags: [events]
      summary: SSE domain event stream
      description: |
        text/event-stream connection. The server first replays events with
        seq > Last-Event-ID (if provided), then streams live events and sends
        periodic keepalive comments. If the client has fallen behind the retention
        window, the server sends a `reset` event with the current last_seq and
        closes the channel — the client must perform a cold re-sync via /v1/sync/snapshot.

        Event kinds: `task_created`, `task_completed`, `task_updated`, `task_moved`,
        `task_reopened`, `project_updated`, `chat_message_created`, `voice_failed`.
      parameters:
        - in: header
          name: Last-Event-ID
          schema:
            type: string
          description: Monotonic seq of the last successfully received event.
      responses:
        "200":
          description: text/event-stream event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/pair/request:
    post:
      tags: [pairing]
      summary: Request pairing for a new device
      description: |
        Initiates the device connection process. The instance saves a record
        in pairing_requests and sends the owner a Telegram DM with a magic-link.
        Available without a bearer token; protected by rate-limiting (5 requests/hour per IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRequestBody"
      responses:
        "202":
          description: Request accepted; magic-link sent to the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingPairingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          description: Rate limit exceeded (5 requests/hour per IP).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Telegram delivery failed; pairing record created, client may retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/pair/status/{id}:
    get:
      tags: [pairing]
      summary: Wait for pairing result (long-poll)
      description: |
        Blocks until a confirmation result is received or the timeout expires
        (up to 60 seconds by default). The client must supply the `nonce` to
        prove ownership of the request.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Pairing request UUID received from POST /v1/pair/request.
        - in: query
          name: nonce
          required: true
          schema:
            type: string
          description: The plain clientNonce provided when creating the request.
      responses:
        "200":
          description: Pairing result (confirmed or pending after timeout).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Nonce mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Pairing request has expired or a token has already been issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pair/confirm/{id}:
    get:
      tags: [pairing]
      summary: Device confirmation page (HTML)
      description: |
        Renders an HTML page with device information and a confirmation form.
        Sets the CSRF cookie `__Host-csrf`. Available without a bearer token.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Pairing request UUID from the magic-link.
      responses:
        "200":
          description: HTML confirmation form page with CSRF cookie.
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Pairing request not found.
          content:
            text/html:
              schema:
                type: string
        "410":
          description: Pairing request has expired.
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [pairing]
      summary: Confirm device connection (HTML form)
      description: |
        Accepts the confirmation form. Validates the CSRF cookie and form field,
        creates the device record, and publishes the bearer token to the long-poll channel.
        Available without a bearer token.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Pairing request UUID.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf]
              properties:
                csrf:
                  type: string
                  description: CSRF token from the hidden form field.
      responses:
        "200":
          description: HTML "Device connected" page.
          content:
            text/html:
              schema:
                type: string
        "403":
          description: CSRF validation failed or token has expired.
          content:
            text/html:
              schema:
                type: string
        "410":
          description: Pairing request has expired or already confirmed.
          content:
            text/html:
              schema:
                type: string
  /v1/sync/snapshot:
    get:
      tags: [sync]
      summary: Cold re-sync state snapshot
      responses:
        "200":
          description: All projects, open tasks, and the current last_seq to resume SSE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      schema:
        type: string
      description: |
        Client key for write-operation deduplication. The first request is executed;
        subsequent requests with the same key within the TTL receive the cached response.
    ProjectID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Project UUID.
    TaskID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Task UUID.
    DeviceID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Device UUID.
  responses:
    Unauthorized:
      description: Bearer token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Input parsing error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Uniqueness conflict (name/slug already taken, etc.).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Body is syntactically valid but violates business rules (e.g. empty summary).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    DateTimeConfig:
      type: object
      required: [timezone, weekdays, timeOfDay, defaultTimeOfDay, nightCutoffMinutes]
      properties:
        timezone:
          type: string
          description: IANA timezone identifier (e.g. "Europe/Moscow").
          example: Europe/Moscow
        weekdays:
          type: array
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
          description: Working days; remaining days are treated as weekends.
        timeOfDay:
          type: object
          required: [morning, lunch, afternoon, evening]
          properties:
            morning:
              type: string
              pattern: "^[0-2][0-9]:[0-5][0-9]$"
              example: "11:00"
            lunch:
              type: string
              pattern: "^[0-2][0-9]:[0-5][0-9]$"
              example: "12:00"
            afternoon:
              type: string
              pattern: "^[0-2][0-9]:[0-5][0-9]$"
              example: "14:00"
            evening:
              type: string
              pattern: "^[0-2][0-9]:[0-5][0-9]$"
              example: "20:00"
        defaultTimeOfDay:
          type: string
          enum: [morning, lunch, afternoon, evening]
          description: Default period used when no explicit time-of-day is specified.
        nightCutoffMinutes:
          type: integer
          description: Minutes from midnight for the night-cutoff boundary; 0 means disabled.
          example: 0
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable string error code.
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - conflict
                - unprocessable_entity
                - rate_limited
                - internal
                - unavailable
                - timeout
                - alias_invalid
                - alias_taken
                - alias_conflicts_with_name
                - alias_limit_reached
                - alias_forbidden_for_inbox
                - invalid_audio
                - invalid_metadata
                - duration_too_long
                - project_not_found
                - audio_too_large
                - unsupported_media_type
                - transcriber_disabled
            message:
              type: string
              description: Human-readable error message.
    Me:
      type: object
      required: [deviceId, ownerName, version, voiceEnabled]
      properties:
        deviceId:
          type: string
          format: uuid
        ownerName:
          type: string
        telegramUserId:
          type: integer
          format: int64
        version:
          type: string
          description: API version (see info.version).
        voiceEnabled:
          type: boolean
          description: |
            True when the server has a transcription provider configured
            (transcriber.provider != ""). Clients should hide the voice
            recording button when false.
    Project:
      type: object
      required: [id, slug, name, description, aliases, taskCounter, createdAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        aliases:
          type: array
          items:
            type: string
          maxItems: 10
          description: Project alias keywords (lowercase, sorted). Always present; empty array if no aliases.
        taskCounter:
          type: integer
        createdAt:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
          description: Optional slug; auto-generated if omitted.
        description:
          type: string
        aliases:
          type: array
          items:
            type: string
          maxItems: 10
          description: Optional alias keywords. Each is validated and normalized (lowercased, trimmed) by the server.
    UpdateProjectRequest:
      type: object
      description: Absent field — no change; empty string — clear the value.
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        aliases:
          type: array
          items:
            type: string
          maxItems: 10
          description: |
            Replace-set of aliases. Absent — no change; empty array [] — clear all aliases;
            non-empty array — replace the alias set with exactly these values.
            Each alias is validated and normalized (lowercased, trimmed) by the server.
    Task:
      type: object
      required: [id, number, ref, projectId, projectSlug, summary, status, priority, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          description: Monotonic number within the project.
        ref:
          type: string
          description: Human-readable ref of the form <slug>-<number>.
        projectId:
          type: string
          format: uuid
        projectSlug:
          type: string
        summary:
          type: string
        details:
          type: string
        topic:
          type: string
        status:
          type: string
          enum: [open, done, cancelled]
        priority:
          type: integer
          minimum: 0
          maximum: 3
          description: Task importance — 0 none, 1 low, 2 medium, 3 high. Always present; 0 when not set.
        deadline:
          type: string
          format: date-time
          nullable: true
        source:
          $ref: "#/components/schemas/TaskSource"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
    TaskSource:
      type: object
      description: |
        Where the task came from: the channel kind plus a snapshot of the promise
        message taken when the task was created (later edits or history cleanup do
        not change it). Omitted from Task when neither the kind nor the snapshot is
        known (e.g. tasks created before the snapshot existed). Unknown fields are
        omitted.
      properties:
        kind:
          type: string
          enum: [telegram, imap, client]
          description: Channel kind of the source.
        name:
          type: string
          description: Chat title or mailbox. Absent for client sources — the client knows its own device names.
        subject:
          type: string
          description: Email subject (imap only).
        author:
          type: string
          description: Display name of the promise message author.
        text:
          type: string
          maxLength: 1000
          description: Text of the promise message, truncated to 1000 characters.
        at:
          type: string
          format: date-time
          description: Time of the promise message.
        replyTo:
          $ref: "#/components/schemas/TaskSourceQuote"
        link:
          type: string
          format: uri
          description: Deep link to the message. Built only for Telegram supergroups and channels.
        via:
          type: string
          enum: [message, forward, chat, voice, api]
          description: |
            How the task was created: message — extracted from a channel message
            (Telegram group, email); forward — extracted from messages forwarded to
            the bot; chat — by the agent from a text message; voice — by the agent
            from a client voice message; api — via POST /v1/tasks.
    TaskSourceQuote:
      type: object
      description: The message the promise message replied to.
      properties:
        author:
          type: string
          description: Display name of the quoted message author.
        text:
          type: string
          maxLength: 500
          description: Text of the quoted message, truncated to 500 characters.
    TasksPage:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          type: string
          description: Pass as the cursor query parameter to fetch the next page.
    CreateTaskRequest:
      type: object
      required: [summary]
      properties:
        projectId:
          type: string
          format: uuid
          description: If omitted, the task is created in Inbox.
        summary:
          type: string
        details:
          type: string
        topic:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
          description: |
            Task importance — 0 none, 1 low, 2 medium, 3 high. Values outside 0–3,
            non-integers and null are rejected with 422.
    UpdateTaskRequest:
      type: object
      description: |
        Supported fields: summary, details, status, deadline, priority. summary is
        trimmed; an empty string after trim is rejected with 422. deadline=null
        clears the due date. priority must be an integer 0–3 (0 clears it); other
        values, including null, are rejected with 422. An absent field leaves the
        value unchanged; unknown fields are rejected with 400.
      properties:
        summary:
          type: string
        details:
          type: string
        status:
          type: string
          enum: [open, done, cancelled]
        deadline:
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
          minimum: 0
          maximum: 3
          description: Task importance — 0 none, 1 low, 2 medium, 3 high.
    MoveTaskRequest:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
          format: uuid
    Device:
      type: object
      required: [id, name, platform, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
          enum: [ios, android, macos, windows, linux]
        apnsToken:
          type: string
          nullable: true
        fcmToken:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
    UpdateDeviceMeRequest:
      type: object
      description: |
        Pass apnsToken and/or fcmToken. Absent field — no change;
        null — clear; string — set new value.
      properties:
        apnsToken:
          type: string
          nullable: true
        fcmToken:
          type: string
          nullable: true
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ChatReply:
      type: object
      required: [reply]
      properties:
        reply:
          type: string
        tasksTouched:
          type: array
          items:
            type: string
            format: uuid
        projectsTouched:
          type: array
          items:
            type: string
            format: uuid
    ChatHistoryResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          description: Entries of the page, ordered oldest to newest.
          items:
            $ref: "#/components/schemas/ChatHistoryEntry"
        nextBefore:
          type: string
          description: Cursor for the next (older) page, to pass as `before`. Omitted on the last page.
    ChatHistoryEntry:
      type: object
      required: [id, role, kind, text, createdAt, authorName, timestamp]
      properties:
        id:
          type: string
          description: |
            Message id; equals `messageId` of the matching `chat_message_created`
            event and is the value accepted by the `before` cursor.
        role:
          type: string
          enum: [user, agent, system]
          description: |
            `user` for messages from this device, `agent` for agent replies,
            `system` for service records such as voice recognition failures.
        kind:
          type: string
          enum: [text, voice, error]
          description: |
            `text` for typed messages and agent replies, `voice` for voice
            transcripts, `error` for failure notices (with role `system`).
        text:
          type: string
          description: Message text (typed text, transcript, agent reply or failure message).
        createdAt:
          type: string
          format: date-time
        audio:
          $ref: "#/components/schemas/ChatHistoryAudio"
        tasks:
          type: array
          description: |
            Cards of the tasks an agent reply touched, resolved at read time.
            Deleted tasks are omitted; the field is absent when no task remains.
          items:
            $ref: "#/components/schemas/ChatHistoryTask"
        authorName:
          type: string
          description: |
            Kept for older clients: "agent" for agent replies, "system" for
            system records, the device id for user messages.
        timestamp:
          type: string
          format: date-time
          description: Same as `createdAt`; kept for older clients.
    ChatHistoryAudio:
      type: object
      required: [jobId, durationMs]
      description: Voice job of a transcript or of a voice failure.
      properties:
        jobId:
          type: string
          format: uuid
          description: The jobId returned by POST /v1/chat/voice.
        durationMs:
          type: integer
          minimum: 0
          description: Audio length in milliseconds; 0 when unknown.
    ChatHistoryTask:
      type: object
      required: [id, ref, summary, status]
      description: Compact card of a task touched by an agent reply (current state of the task).
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
          description: Human-readable ref of the form <slug>-<number>.
        summary:
          type: string
        status:
          type: string
          enum: [open, done, cancelled]
        deadline:
          type: string
          format: date-time
    PairingRequestBody:
      type: object
      required: [deviceName, platform, clientNonce]
      properties:
        deviceName:
          type: string
          description: Human-readable device name (e.g. "Alice's iPhone").
        platform:
          type: string
          enum: [ios, android, macos, windows, linux]
          description: Device platform.
        clientNonce:
          type: string
          description: Random string (base64url, minimum 16 bytes) used to bind the long-poll to the request.
        apnsToken:
          type: string
          nullable: true
          description: APNs push token (iOS/macOS).
        fcmToken:
          type: string
          nullable: true
          description: FCM push token (Android).
    PendingPairingResponse:
      type: object
      required: [pairId, pollUrl, expiresAt]
      properties:
        pairId:
          type: string
          format: uuid
          description: Pairing request UUID; used in /v1/pair/status/{id}.
        pollUrl:
          type: string
          description: Relative URL for long-poll waiting.
        expiresAt:
          type: string
          format: date-time
          description: Pairing request expiry time (UTC).
    PairingStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, expired]
          description: Current status of the pairing request.
        deviceId:
          type: string
          format: uuid
          nullable: true
          description: UUID of the created device (only when status=confirmed).
        bearerToken:
          type: string
          nullable: true
          description: Bearer token for authorization (only when status=confirmed; shown once).
    VoiceChatMetadata:
      type: object
      required: [durationMs, mimeType]
      properties:
        durationMs:
          type: integer
          minimum: 0
          description: Duration of the audio recording in milliseconds.
          example: 3500
        mimeType:
          type: string
          description: |
            MIME type of the audio file. Must match the Content-Type of the
            audio part and be one of the accepted types.
          enum:
            - "audio/ogg;codecs=opus"
            - "audio/mp4"
            - "audio/webm;codecs=opus"
            - "audio/wav"
        projectId:
          type: string
          format: uuid
          description: |
            Optional project context hint. When the client is displaying a specific
            project screen, pass its UUID so the agent uses it as the default for
            new tasks. Server validates the project exists; unknown UUID → 400.
    VoiceJobCreatedResponse:
      type: object
      required: [jobId, createdAt]
      properties:
        jobId:
          type: string
          format: uuid
          description: Stable UUID for correlating SSE events (audioJobId / voice_failed.jobId).
        createdAt:
          type: string
          format: date-time
          description: Server-side timestamp when the job was enqueued.
    ChatMessageCreatedEvent:
      type: object
      required: [messageId, source, role, text, createdAt]
      description: |
        SSE event emitted for every agent interaction: text chat (POST /v1/chat)
        and voice chat (POST /v1/chat/voice). Two events are emitted per turn:
        role=user (transcript or typed text) followed by role=agent (agent reply).
        The fields mirror the matching GET /v1/chat/history entry, so clients can
        render the message live without refetching the history.
      properties:
        messageId:
          type: string
          format: uuid
          description: Stable UUID of the message row in the history store.
        source:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [client]
              description: Source kind; currently always "client" for HTTP-originated messages.
            id:
              type: string
              format: uuid
              description: Device UUID of the originating client.
        role:
          type: string
          enum: [user, agent]
        kind:
          type: string
          enum: [text, voice]
          description: |
            `voice` for a voice transcript, `text` for typed messages and agent
            replies. Absent in events emitted by older servers; treat as `text`.
        text:
          type: string
          description: Message text (transcript for voice, typed text for chat).
        audioJobId:
          type: string
          format: uuid
          description: Present only when the message originated from a voice job (POST /v1/chat/voice).
        audioDurationMs:
          type: integer
          minimum: 0
          description: Audio length in milliseconds; present on voice transcripts when the length is known.
        taskIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            UUIDs of the tasks an agent reply touched; absent when none. For a
            quick voice acknowledgement the list holds the tasks seen so far;
            tasks touched later appear in GET /v1/chat/history.
        createdAt:
          type: string
          format: date-time
    VoiceFailedEvent:
      type: object
      required: [jobId, code, message]
      description: SSE event emitted when a voice transcription job fails after all retry attempts.
      properties:
        jobId:
          type: string
          format: uuid
          description: The jobId returned by POST /v1/chat/voice.
        code:
          type: string
          enum:
            - transcription_failed
            - invalid_audio
            - unsupported_format
            - agent_failed
          description: Machine-readable failure reason.
        message:
          type: string
          description: Human-readable description of the failure (locale-aware).
    SyncSnapshot:
      type: object
      required: [projects, openTasks, lastSeq]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        openTasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        lastSeq:
          type: integer
          format: int64
          description: Current max event seq; pass as Last-Event-ID when connecting to /v1/events.
